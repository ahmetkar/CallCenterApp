version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: voiceapp-postgres
    restart: unless-stopped
    ports:
      - "5500:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-VoiceShop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Istanbul
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
